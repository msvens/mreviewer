# Example instance config. Copy templates/instance/ to $MREVIEWER_HOME (default ~/.mreviewer).

projects_root: ~/projects # where your local checkouts live

scheduler: launchd # launchd | ui
poll_interval_minutes: 15
quiet_hours: '22:00-08:00'

review:
  model: claude-opus-5-5 # model for reviews
  max_turns: 80 # agent turns per review
  timeout_minutes: 30 # a run is stopped after this
  review_event: comment # comment only for now (PAT cannot request changes on own PRs)
  max_nits: 3
  check_timeout_minutes: 10 # per check command, install included
  auto_post: false # drafts need approval

notify: macos # macos | none

repos:
  - name: owner/example-app # GitHub owner/repo
    path: github.com/owner/example-app # relative to projects_root
    stack: sveltekit
    role: active # active | maintained | stale
    authority: true # a source of conventions
    # Checks: core installs dependencies and runs the checks on the PR head in a sandbox before the
    # review. Install may reach the package registry only; checks get no network at all.
    run_checks: true # opt in per repo
    # trusted_authors: [owner] # whose PRs may run code (default: the repo owner)
    # toolchain: pnpm # pnpm | go; detected from the lockfile when omitted
    # checks: # default: the typecheck, check:svelte, lint and test scripts that exist
    #   - name: typecheck
    #     run: pnpm run check:svelte
    #   - name: test
    #     run: pnpm run test

  - name: owner/example-service
    path: github.com/owner/example-service
    stack: go
    role: active
    run_checks: true # go vet, go test, and golangci-lint when the repo configures it
    # Tests that need a local database: lets checks connect to any port on localhost.
    allow_localhost: false
